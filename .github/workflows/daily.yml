name: daily-contribution

on:
  schedule:
    # 11:35 UTC — DeepSeek off-peak (weekday peak is 01:00–04:00 and 06:00–10:00 UTC).
    - cron: "35 11 * * *"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || pip install -e .

      - name: Daily increment (applies, tests, commits only if green)
        run: python scripts/daily.py
        env:
          GIT_AUTHOR_NAME: Collins Amatu Gorgerat
          GIT_AUTHOR_EMAIL: 133529715+wl5e@users.noreply.github.com
          GIT_COMMITTER_NAME: Collins Amatu Gorgerat
          GIT_COMMITTER_EMAIL: 133529715+wl5e@users.noreply.github.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
